<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NovaAI</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">

    <h2 class="sidebar-logo">

      NovaAI

    </h2>

    <div class="recent">

      <button id="new-chat-btn">

  + New Chat

</button>
      <h3>Recents</h3>

      <div id="recent-chats"></div>

    </div>

  </div>

  <!-- MAIN CHAT -->

  <div class="main-chat">

   <div id="chat-box">

  <div id="welcome-text">

    Ask anything...

  </div>

</div>

    <!-- INPUT AREA -->

    <div class="input-area">

      <button id="add-btn">
        +
      </button>

      <input
        id="user-input"
        placeholder="Message NovaAI..."
      >

      <button id="mic-btn">
        🎤
      </button>

      <button id="send-btn">
        ➤
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
